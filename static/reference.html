<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blura News API Reference</title>
</head>
<body>
  <!-- Scalar renders the spec FastAPI generates at /openapi.json, so the
       docs and the "Test Request" playground always match the live routes. -->
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  <script>
    Scalar.createApiReference('#app', {
      url: '/openapi.json',
      layout: 'modern',
      hideClientButton: false,
      defaultOpenAllTags: false,
      servers: [{ url: window.location.origin, description: 'This server' }],
    })
  </script>
</body>
</html>
